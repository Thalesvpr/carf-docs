# ============================================
# CARF — HOMOLOGAÇÃO (HML)
# ============================================
#
# Uso:
#   cp .env.example .env
#   nano .env                        # preencher VPS_IP e senhas
#   docker compose up -d --build
#   docker compose logs -f
#
# URLs (substitua IP pelo seu):
#   hml-app.IP.sslip.io      → REURBWEB
#   hml-admin.IP.sslip.io    → REURBMASTER
#   hml-api.IP.sslip.io      → GEOAPI (Swagger: /swagger)
#   hml-auth.IP.sslip.io     → Keycloak
#   hml-s3.IP.sslip.io       → MinIO Console
#   hml-storage.IP.sslip.io  → MinIO API

services:
  # ─── Infraestrutura ────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    container_name: carf-hml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - carf-hml-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  keycloak-db:
    image: postgres:16-alpine
    container_name: carf-hml-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_hml
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - carf-hml-kc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  redis:
    image: redis:7-alpine
    container_name: carf-hml-redis
    restart: unless-stopped
    volumes:
      - carf-hml-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  minio:
    image: minio/minio:latest
    container_name: carf-hml-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - carf-hml-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  minio-init:
    image: minio/mc:latest
    container_name: carf-hml-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/carf-documents --ignore-existing;
      echo 'Bucket carf-documents OK';
      "
    networks:
      - carf-hml

  # ─── Keycloak ──────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: carf-hml-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_hml
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: hml-auth.${VPS_IP}.sslip.io
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../../CENTRAL/INTEGRATION/KEYCLOAK/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - carf-hml

  # ─── GEOAPI (.NET 9) ──────────────────────────────

  geoapi:
    build:
      context: ../../GEOAPI/SRC-CODE/CARF-GEOAPI
      dockerfile: Dockerfile
    container_name: carf-hml-geoapi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}
      Keycloak__Authority: http://hml-auth.${VPS_IP}.sslip.io/realms/carf
      Keycloak__Audience: carf-api
      Keycloak__AdminClientId: geoapi-admin
      Keycloak__AdminClientSecret: ${KC_GEOAPI_CLIENT_SECRET:-changeme}
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__BucketName: carf-documents
      Redis__ConnectionString: redis:6379
      Cors__AllowedOrigins__0: http://hml-app.${VPS_IP}.sslip.io
      Cors__AllowedOrigins__1: http://hml-admin.${VPS_IP}.sslip.io
    extra_hosts:
      - "hml-auth.${VPS_IP}.sslip.io:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - carf-hml

  # ─── Frontends ─────────────────────────────────────

  reurbweb:
    build:
      context: ../../..
      dockerfile: PROJECTS/DEPLOY/dockerfiles/frontend.Dockerfile
      args:
        PROJECT_DIR: PROJECTS/REURBWEB/SRC-CODE/carf-reurbweb
        TSCORE_DIR: PROJECTS/LIB/TS/TSCORE/SRC-CODE/carf-tscore
        GEOAPI_CLIENT_DIR: PROJECTS/LIB/TS/GEOAPI-CLIENT/SRC-CODE/carf-geoapi-client
        VITE_API_URL: http://hml-api.${VPS_IP}.sslip.io/api
        VITE_KEYCLOAK_URL: http://hml-auth.${VPS_IP}.sslip.io
        VITE_KEYCLOAK_REALM: carf
        VITE_KEYCLOAK_CLIENT_ID: reurbweb
        VITE_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY}
    container_name: carf-hml-reurbweb
    restart: unless-stopped
    networks:
      - carf-hml

  reurbmaster:
    build:
      context: ../../..
      dockerfile: PROJECTS/DEPLOY/dockerfiles/frontend.Dockerfile
      args:
        PROJECT_DIR: PROJECTS/REURBMASTER/SRC-CODE/carf-reurbmaster
        TSCORE_DIR: PROJECTS/LIB/TS/TSCORE/SRC-CODE/carf-tscore
        GEOAPI_CLIENT_DIR: PROJECTS/LIB/TS/GEOAPI-CLIENT/SRC-CODE/carf-geoapi-client
        VITE_API_URL: http://hml-api.${VPS_IP}.sslip.io/api
        VITE_KEYCLOAK_URL: http://hml-auth.${VPS_IP}.sslip.io
        VITE_KEYCLOAK_REALM: carf
        VITE_KEYCLOAK_CLIENT_ID: reurbmaster
        VITE_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY}
    container_name: carf-hml-reurbmaster
    restart: unless-stopped
    networks:
      - carf-hml

  # ─── Reverse Proxy ────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: carf-hml-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VPS_IP: ${VPS_IP}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - geoapi
      - keycloak
      - reurbweb
      - reurbmaster
      - minio
    networks:
      - carf-hml

volumes:
  carf-hml-pgdata:
  carf-hml-kc-pgdata:
  carf-hml-redis:
  carf-hml-minio:

networks:
  carf-hml:
    driver: bridge
