# ============================================
# CARF — HOMOLOGACAO (HML)
# ============================================
#
# Uso:
#   cp .env.example .env
#   nano .env                        # preencher VPS_IP e senhas
#   docker compose up -d --build
#   docker compose logs -f
#
# URLs (substitua IP pelo seu):
#   hml-app.IP.sslip.io      -> REURBWEB
#   hml-admin.IP.sslip.io    -> REURBMASTER
#   hml-api.IP.sslip.io      -> GEOAPI (Swagger: /swagger)
#   hml-auth.IP.sslip.io     -> Keycloak
#   hml-s3.IP.sslip.io       -> MinIO Console
#   hml-storage.IP.sslip.io  -> MinIO API
#
# Troubleshooting:
#   - Frontends 403 no build? Verificar NPM_TOKEN no .env (precisa read:packages na org)
#   - GEOAPI 500? Provavelmente RequireHttpsMetadata — ver env vars abaixo
#   - Keycloak admin 401? Rodar bootstrap-admin (ver POST-DEPLOY.md)

services:
  # --- Infraestrutura ----------------------------------------

  postgres:
    image: postgis/postgis:16-3.4
    container_name: carf-hml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - carf-hml-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  keycloak-db:
    image: postgres:16-alpine
    container_name: carf-hml-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_hml
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - carf-hml-kc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  redis:
    image: redis:7-alpine
    container_name: carf-hml-redis
    restart: unless-stopped
    volumes:
      - carf-hml-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  minio:
    image: minio/minio:latest
    container_name: carf-hml-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - carf-hml-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carf-hml

  minio-init:
    image: minio/mc:latest
    container_name: carf-hml-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/carf-documents --ignore-existing;
      echo 'Bucket carf-documents OK';
      "
    networks:
      - carf-hml

  # --- Keycloak ----------------------------------------------
  # Imagem: Keycloak 26.x (start-dev para HML, nao precisa de HTTPS)
  # O realm 'carf' e importado automaticamente no primeiro boot.
  # Boots subsequentes ignoram o import (dados ja existem no DB).
  #
  # GOTCHA: KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD so criam o admin
  # no PRIMEIRO boot. Se o volume persistir e a senha mudar no .env,
  # precisa fazer bootstrap-admin (ver POST-DEPLOY.md).

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: carf-hml-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_hml
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: hml-auth.${VPS_IP}.sslip.io
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../../CENTRAL/INTEGRATION/KEYCLOAK/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./keycloak-theme:/opt/keycloak/themes/carf:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Keycloak 26 management interface runs on port 9000
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - carf-hml

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0
    container_name: carf-hml-keycloak-init
    entrypoint: /bin/bash
    command: /scripts/keycloak-init.sh
    restart: "no"
    environment:
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      VPS_IP: ${VPS_IP}
      KC_SEED_USER_PASSWORD: ${KC_SEED_USER_PASSWORD:-Dev@1234}
    volumes:
      - ./scripts/keycloak-init.sh:/scripts/keycloak-init.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - carf-hml

  # --- GEOAPI (.NET 9) ----------------------------------------
  # GOTCHA: HML usa HTTP para Keycloak, entao:
  #   - ASPNETCORE_ENVIRONMENT=Development (desabilita RequireHttpsMetadata)
  #   - Ou usar Keycloak__RequireHttpsMetadata=false (se codigo suportar)
  # extra_hosts mapeia o hostname sslip.io para o host gateway,
  # permitindo que o GEOAPI alcance o Keycloak via nginx.

  geoapi:
    build:
      context: ../../GEOAPI/SRC-CODE/CARF-GEOAPI
      dockerfile: Dockerfile
    container_name: carf-hml-geoapi
    restart: unless-stopped
    environment:
      # Development porque Keycloak roda HTTP (sem TLS)
      # Em producao com HTTPS, trocar para Staging/Production
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}
      Keycloak__Authority: http://hml-auth.${VPS_IP}.sslip.io/realms/carf
      Keycloak__Audience: carf-api
      Keycloak__RequireHttpsMetadata: "false"
      Keycloak__ValidateIssuer: "false"
      Keycloak__AdminClientId: geoapi-admin
      Keycloak__AdminClientSecret: ${KC_GEOAPI_CLIENT_SECRET:-changeme}
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__BucketName: carf-documents
      Redis__ConnectionString: redis:6379
      Cors__AllowedOrigins__0: http://hml-app.${VPS_IP}.sslip.io
      Cors__AllowedOrigins__1: http://hml-admin.${VPS_IP}.sslip.io
    extra_hosts:
      - "hml-auth.${VPS_IP}.sslip.io:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Override do Dockerfile healthcheck (/health/live nao existe na build atual)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/swagger/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - carf-hml

  # --- Frontends -----------------------------------------------
  # Build via frontend.Dockerfile compartilhado.
  # Libs (@carffundiaria/*) sao baixadas do GitHub Packages via NPM_TOKEN.
  #
  # GOTCHA: O token precisa de scope read:packages com acesso a org carffundiaria.
  # Tokens pessoais (ghp_*) precisam de SSO authorize.
  # Tokens de gh auth (gho_*) funcionam mas podem expirar.
  # Ideal: PAT classico com read:packages + SSO authorized.

  reurbweb:
    build:
      context: ../../..
      dockerfile: PROJECTS/DEPLOY/dockerfiles/frontend.Dockerfile
      args:
        PROJECT_DIR: PROJECTS/REURBWEB/SRC-CODE/carf-reurbweb
        NPM_TOKEN: ${NPM_TOKEN}
        VITE_API_URL: http://hml-api.${VPS_IP}.sslip.io/api
        VITE_KEYCLOAK_URL: http://hml-auth.${VPS_IP}.sslip.io
        VITE_KEYCLOAK_REALM: carf
        VITE_KEYCLOAK_CLIENT_ID: reurbweb
        VITE_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY}
    container_name: carf-hml-reurbweb
    restart: unless-stopped
    networks:
      - carf-hml

  reurbmaster:
    build:
      context: ../../..
      dockerfile: PROJECTS/DEPLOY/dockerfiles/frontend.Dockerfile
      args:
        PROJECT_DIR: PROJECTS/REURBMASTER/SRC-CODE/carf-reurbmaster
        NPM_TOKEN: ${NPM_TOKEN}
        VITE_API_URL: http://hml-api.${VPS_IP}.sslip.io/api
        VITE_KEYCLOAK_URL: http://hml-auth.${VPS_IP}.sslip.io
        VITE_KEYCLOAK_REALM: carf
        VITE_KEYCLOAK_CLIENT_ID: reurbmaster
        VITE_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY}
    container_name: carf-hml-reurbmaster
    restart: unless-stopped
    networks:
      - carf-hml

  # --- Reverse Proxy -------------------------------------------
  # Nginx usa envsubst automatico para substituir ${VPS_IP} no template.
  # Catch-all retorna 444 (drop connection) para requests sem Host valido.

  nginx:
    image: nginx:alpine
    container_name: carf-hml-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VPS_IP: ${VPS_IP}
      ENVIRONMENT: ${ENVIRONMENT}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - geoapi
      - keycloak
      - reurbweb
      - reurbmaster
      - minio
    networks:
      - carf-hml

volumes:
  carf-hml-pgdata:
  carf-hml-kc-pgdata:
  carf-hml-redis:
  carf-hml-minio:

networks:
  carf-hml:
    driver: bridge
