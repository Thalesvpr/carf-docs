  <!-- Text "CARF" -->
  <text x="90" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C5F2D">CARF</text>

  <!-- Subtitle -->
  <text x="90" y="55" font-family="Arial, sans-serif" font-size="10" fill="#666666">Sistema de Regularização</text>
  <text x="90" y="67" font-family="Arial, sans-serif" font-size="10" fill="#666666">Fundiária Urbana</text>
