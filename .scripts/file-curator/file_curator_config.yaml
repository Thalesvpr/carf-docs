scan:
  include_patterns:
    - "**/*.md"
  exclude_dirs:
    - ".git"
    - ".obsidian"
    - ".scripts"
    - "SRC-CODE"
    - "node_modules"
    - "file-curator"
    - "__pycache__"
    - ".venv"
    - "venv"

paths:
  data_dir: "data"
  templates_dir: "templates"
  reviews_dir: "data/reviews"

review:
  require_observations: false
  require_justification_on_reject: true
  skip_returns_to_queue: true

scripts:
  enabled: true
  require_approval: true
  default_to_dry_run: true

tui:
  theme: "dark"
  show_preview: true
  preview_max_lines: 20
